server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy al backend — el contenedor se llama cigua_backend en la red interna
    location /api {
        proxy_pass         http://cigua_backend:3981;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para operaciones largas (IA, ERP sync)
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # React SPA — siempre devolver index.html para rutas del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache largo para assets con hash (Vite los genera con contenido hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin cache para HTML y JSON (el index.html siempre debe ser fresco)
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.html;
}
